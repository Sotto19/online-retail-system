<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="Create your ShopEase account."/><title>Register — ShopEase</title><link rel="stylesheet" href="css/reset.css"/><link rel="stylesheet" href="css/variables.css"/><link rel="stylesheet" href="css/base.css"/><link rel="stylesheet" href="css/layout.css"/><link rel="stylesheet" href="css/navbar.css"/><link rel="stylesheet" href="css/footer.css"/><link rel="stylesheet" href="css/buttons.css"/><link rel="stylesheet" href="css/badges.css"/><link rel="stylesheet" href="css/forms.css"/><link rel="stylesheet" href="css/cards.css"/><link rel="stylesheet" href="css/tables.css"/><link rel="stylesheet" href="css/utilities.css"/><link rel="stylesheet" href="css/responsive.css"/></head><body><a href="#main" class="skip-link">Skip to main content</a><header class="navbar"><div class="navbar__strip">Free delivery on orders above Rs 499!</div><div class="navbar__main"><a href="index.html" class="navbar__logo">ShopEase</a><div class="navbar__search"><form class="search-form" role="search"><input type="search" placeholder="Search products..." aria-label="Search"/><button type="submit" aria-label="Search">Search</button></form></div><nav class="navbar__icons"><a href="customer/cart.html" class="navbar__icon-btn" aria-label="Cart">Cart</a></nav></div></header><main id="main"><div class="container"><div class="auth-card" style="max-width:520px"><div class="auth-card__header"><a href="index.html" class="auth-card__logo">ShopEase</a><div class="auth-card__title">Create Account</div><div class="auth-card__subtitle">Join millions of happy shoppers</div></div><div class="auth-card__body"><form novalidate><div class="form-grid"><div class="form-group"><label for="fname">First Name</label><input id="fname" type="text" class="form-control" placeholder="Priya" autocomplete="given-name" required/></div><div class="form-group"><label for="lname">Last Name</label><input id="lname" type="text" class="form-control" placeholder="Sharma" autocomplete="family-name" required/></div></div><div class="form-group"><label for="reg-email">Email Address</label><input id="reg-email" type="email" class="form-control" placeholder="priya@example.com" autocomplete="email" required/></div><div class="form-group"><label for="phone">Mobile Number</label><input id="phone" type="tel" class="form-control" placeholder="+91 98765 43210" autocomplete="tel" required/></div><div class="form-group"><label for="reg-pwd">Password</label><input id="reg-pwd" type="password" class="form-control" placeholder="Min 8 characters" autocomplete="new-password" required/></div><div class="form-group"><label for="confirm-pwd">Confirm Password</label><input id="confirm-pwd" type="password" class="form-control" placeholder="Repeat password" autocomplete="new-password" required/></div><div class="form-group mb-md"><label class="check-group"><input type="checkbox" required/> I agree to the Terms of Service</label></div><button type="submit" class="btn btn--primary btn--full">Create Account</button></form></div><div class="auth-card__footer">Already have an account? <a href="login.html">Sign in</a></div></div></div></main><footer class="footer"><div class="footer__bottom" style="max-width:1320px;margin:0 auto;border-top:none;padding:16px"><p class="footer__copyright">2026 ShopEase. All rights reserved.</p></div></footer></body></html>
